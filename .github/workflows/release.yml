name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Match tag to Program versions
        run: |
          node -e 'const fs = require("node:fs"); const version = require("./package.json").version; const config = fs.readFileSync("phresh.config.ts", "utf8"); if (process.argv[1] !== `v${version}` || !config.includes(`version: "${version}"`)) throw new Error(`Tag and Program versions must all be ${version}`)' "$GITHUB_REF_NAME"
      - run: bun run pack
      - name: Publish verified Program
        run: gh release create "$GITHUB_REF_NAME" program.json icon.png ./*.zip ./*.zip.sha256 --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
